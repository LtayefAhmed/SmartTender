server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers — the app is same-origin JSON + static assets.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Reverse-proxy the API so the browser stays same-origin (no CORS).
    # The client calls /api/... and this strips the prefix before the backend.
    #
    # The upstream host is held in a VARIABLE on purpose. With a literal name,
    # nginx resolves it once at startup and caches that address for the life of
    # the process — so the moment the api container is recreated with a new IP,
    # every request 502s until nginx itself is restarted. Rebuilding the backend
    # would silently take the interface down. A variable forces re-resolution
    # against Docker's embedded DNS, which returns the current address.
    #
    # Using a variable also disables nginx's automatic prefix stripping, hence
    # the regex capture rebuilding the path (and the query string) by hand.
    location ~ ^/api/(?<backend_path>.*)$ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream api;
        proxy_pass http://$api_upstream:8000/$backend_path$is_args$args;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        # Uploads can be up to 25 MB (+ multipart overhead).
        client_max_body_size 40m;
    }

    # Hashed assets are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: every route renders index.html, React Router takes it from there.
    #
    # index.html must never be cached, and this is not a preference. It names
    # the hashed bundle, and every rebuild mints a new hash. A browser holding
    # yesterday's index.html asks for yesterday's bundle, which no longer
    # exists — nginx answers 404 and the user gets a blank page with a spinner
    # that never stops. Nothing in the logs looks wrong, because nothing is:
    # the server correctly reports that a file it no longer has is missing.
    #
    # Served with only an ETag, the file falls under heuristic caching, which
    # is precisely the case where a browser may reuse a response without ever
    # asking. `no-cache` still allows caching — it requires revalidation, so
    # the 304 path is kept and only a genuinely changed page is re-downloaded.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
