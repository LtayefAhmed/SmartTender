global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: smarttender-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: smarttender-ingestion
          component: api

  # Workers export process-level metrics; the pipeline counters they increment
  # are aggregated by the API's registry in this single-node setup. A
  # multi-node deployment should add a pushgateway or per-worker exporter here.
  - job_name: smarttender-flower
    metrics_path: /flower/metrics
    static_configs:
      - targets: ["flower:5555"]
        labels:
          service: smarttender-ingestion
          component: celery
