[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# The URL is injected from application settings in alembic/env.py so there is
# exactly one place that knows how to build a DSN. Leave this blank.
sqlalchemy.url =

[post_write_hooks]
# Formatting a generated migration is convenient but must never be able to fail
# the generation itself — the `console_scripts` entrypoint is not resolvable in
# every environment (containers, isolated venvs), and a failed hook leaves you
# thinking the revision was not written when it was. Run `ruff format` on the
# file yourself, or re-enable this once your environments are uniform.
hooks =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
