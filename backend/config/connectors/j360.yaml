# =============================================================================
# J360 — commercial tender aggregator (https://app.j360.info)
#
# Real contract, captured from the application:
#     GET /api/searches/{saved_search_id}/announces?order_by=date_limite
#     → {count, next, previous, results[], current_page, total_pages, paginate_by}
#
# Django REST Framework behind JWT-in-cookie (SimpleJWT).
#
# ── AUTHENTICATION ──────────────────────────────────────────────────────────
# The login is behind an anti-bot layer, so it is captured once in a real
# browser:
#     smarttender-admin capture-login j360
#
# That yields two cookies with very different lifetimes:
#     JWT-access    ~15 minutes   ← dies mid-crawl, always
#     JWT-refresh   ~4 years      ← used to mint new access tokens
#
# So the connector refreshes the access token itself (see `token_refresh`)
# rather than asking a human to re-capture every quarter of an hour.
#
# ── BILLING: MEASURED, NOT ASSUMED ─────────────────────────────────────────
# An earlier version of this file warned that opening an announcement was a
# metered action costing ~€9. That was wrong, and the correction is worth
# recording so nobody re-introduces the caution.
#
# What that claim rested on: every list result carries `paid: false`, the app
# has an `overquota` route, and public pricing pages mention per-announcement
# rates. None of it was checked against this account.
#
# What measurement showed:
#   GET /api/me  →  subscription_active: "True", is_overquota: false
#                   additional_user_price: "5.00"   ← per extra USER SEAT
#                   has_reached_users_limit, has_reached_invitations_limit
#   There is no announcement-consumption counter anywhere in the account.
#
#   Fetching the detail of an announcement with `viewed: false, paid: false`
#   returned HTTP 200 with full content, and every counter in /api/me was
#   byte-identical before and after.
#
# The quota model is SEATS, not views. `paid` on a list result is a property of
# the announcement, not a statement about what this account owes.
#
# Detail enrichment is therefore included in the subscription. The rate limit
# below stays low for a different and still-valid reason: the session
# identifies the account on every request, and volume is what gets noticed.
#
# ── ⚠ J360 RE-PUBLISHES TUNEPS ──────────────────────────────────────────────
# `source_name` on real results includes "TN - TUNEPS" and "TN - Plateforme des
# marchés publics" — content we already scrape for free. Two of the three
# results in the sample capture were the *same* ANCE tender from two portals.
#
# Deduplication will collapse those against the free TUNEPS feed, so J360's
# real marginal value is its INTERNATIONAL coverage (UN, EU, development
# banks). Prefer saved searches that are not Tunisia-only.
# =============================================================================
key: "j360"
name: "J360 — Agrégateur d'appels d'offres"
enabled: true
country: null                # multi-country aggregator
language: "fr"
timezone: "Europe/Paris"

strategy: "api"

base_url: "https://app.j360.info"

auth:
  mode: "browser_session"
  login_url: "https://app.j360.info/#/login"
  session_file: null          # defaults to certs/j360-session.json
  #: Bounded by the REFRESH token's life, not the access token's — the access
  #: token is renewed automatically below.
  session_max_age_hours: 8760
  token_refresh:
    enabled: true
    #: Tried in order, and the first one that returns a token is pinned for the
    #: rest of the run. The connector falls back to the conventional SimpleJWT
    #: paths after these, so a wrong guess costs one round of 404s rather than
    #: a failed crawl. `connector.token_refresh_empty` means none of them
    #: worked — capture the real path from the `renew` request in DevTools.
    endpoint:
      - "/api/token/refresh/"
      - "/api/token/renew/"
    method: "POST"
    refresh_cookie: "JWT-refresh"
    access_cookie: "JWT-access"
    refresh_body_field: "refresh"
    access_response_path: "access"
    #: Renew this many seconds before expiry, so a slow page cannot straddle it.
    refresh_margin_seconds: 120
  credentials_env:
    username: "SMARTTENDER_CONNECTOR_J360_USERNAME"
    password: "SMARTTENDER_CONNECTOR_J360_PASSWORD"

# ── SEARCH MODE ──────────────────────────────────────────────────────────────
# "query"        Push our filters to /api/announces. The portal does the
#                filtering, so a page of results is a page of *matches* and
#                paging deeper reaches genuinely new tenders. This is the
#                default and what the Scrape screen drives.
#
# "saved_search" Crawl a search curated in J360's own UI. Useful for a standing
#                watch the team maintains there, but its criteria are frozen:
#                filters entered in our UI can only narrow what it already
#                returned, never widen it. That is why a saved search holding
#                three notices can never answer a keyword search.
search_mode: "query"

# Used only when search_mode is "saved_search".
# The id is the number in app.j360.info/#/my-monitoring/searches/<id>
saved_searches:
  - id: 57549
    name: "MBO_TUN"

endpoints:
  search: "/api/announces"
  saved_search: "/api/searches/{search_id}/announces"

pagination:
  # DRF envelope: follow the server's own `next` link rather than rebuilding
  # parameters. Survives renames and server-side page-size caps.
  mode: "next_url"
  next_response_path: "next"
  page_param: "page"
  page_size_param: "paginate_by"
  page_size: 20               # the API's own default
  start_page: 1
  # Server-side filtering means every page is a page of matches, so this cap
  # now bounds real results rather than wasted fetches. Still modest: the
  # account is metered and the crawl is deliberately single-threaded.
  max_pages: 10
  stop_on_empty_page: true

default_query:
  # Newest first. `-created` is what J360's own UI sends, and ordering by an
  # append-only field keeps deep pagination from drifting as notices arrive
  # mid-crawl — a tender would otherwise shift onto a page we already passed.
  order_by: "-created"
  # Search titles *and* body text. Restricted to titles, most notices whose
  # subject is stated only in the body would be missed.
  search_all_fields: true
  op: "AND"
  # `mc` = marché en cours. J360's UI also offers ma (archived), rm (results),
  # ab (business news) and ap (calls for projects); its defaults include all of
  # them, which is why a browser search surfaces notices closed five years ago.
  # A bid-detection tool wants what can still be bid on.
  type: "mc"

# ── CONTENT FILTERING ────────────────────────────────────────────────────────
# J360 aggregates more than procurement notices. `special_criterion` carries
# the flags its own search form exposes; INDIV marks an individual-consultant
# or temporary-work posting — recruitment, not a contract to bid on.
#
# Without this, an ad for an "Assistant administratif (H/F)" whose description
# happens to mention Sage X3 scores like a genuine ERP tender and lands near
# the top of the dashboard.
#
# Set to false if Inetum wants to see staffing requests too — "Assistance
# Technique (mise à disposition de ressources)" is in the service catalogue, so
# a share of these are legitimately in scope.
exclude_criteria:
  - "INDIV"

filter_mapping:
  # Pushed to the portal. Everything named here is applied by J360 itself, so
  # a page of results is a page of matches — which is what makes "give me 40
  # results" reach genuinely new tenders instead of re-filtering the same two
  # pages. Anything left null is still applied locally after normalisation.
  keywords: "q_simple"
  countries: "countries"
  sectors: "trades"
  publication_date_from: "date_publication_after"
  deadline_from: "date_limite_after"
  deadline_to: "date_limite_before"
  # No server-side equivalent observed; handled client-side.
  excluded_keywords: null
  organization: null
  budget_min: null
  status: null

filter_values:
  # Our filters speak country *names*; J360 speaks ISO-3166 alpha-2.
  countries:
    "Tunisie": "TN"
    "Tunisia": "TN"
    "Mauritanie": "MR"
    "Maroc": "MA"
    "Algérie": "DZ"
    "France": "FR"
    "Sénégal": "SN"
    "Côte d'Ivoire": "CI"
    "Belgique": "BE"
  # J360 "trades" are numeric activity ids. These five are the account's own
  # IT selection, read off the search form: Conseil ressources humaines,
  # Consulting IT, Développement informatique, Elearning, and Logiciels de
  # gestion et bureautique. Names are ours; only the ids matter to the API.
  sectors:
    "Conseil RH": 60
    "Consulting IT": 133
    "Développement informatique": 132
    "Elearning": 29
    "Logiciels de gestion": 105
  # J360's announce_type codes, mapped to the platform vocabulary.
  procurement_type:
    open: "MC"                      # Marché en cours
    prior_information_notice: "AP"  # Appel à projets
    awarded: "RM"                   # Résultat de marché

response_mapping:
  items_path: "results"
  total_path: "count"
  item:
    external_id: "id"
    title: "title"
    buyer: "buyer"
    buyer_country: "buyer_place.country_name"
    publication_date: "date_publication"
    deadline: "limit_date"
    estimated_budget: "amount"
    procurement_type: "announce_type"
    status: "announce_category"
    # J360's own provenance — which portal it scraped this from.
    source: "source_name"
    source_website: "source_domain"

parsing:
  date_formats:
    - "%Y-%m-%dT%H:%M:%S"
    - "%Y-%m-%dT%H:%M:%S%z"
    - "%Y-%m-%d"
  decimal_separator: "."
  thousands_separator: ","
  default_currency: "EUR"

required_fields: ["title", "source_url"]

documents:
  # Detail fetches are included in the subscription (see BILLING above), so
  # this is now a *scope* decision rather than a cost one. Enabled by the
  # enrichment pass, which opens only announcements worth the round trip
  # instead of every result — the rate limit makes indiscriminate fetching
  # slow, not expensive.
  download: true
  # Attached files are hosted on the originating portal, not on J360, so a
  # download leaves the subscriber API entirely.
  follow_external: true

http:
  robots:
    enabled: false            # authenticated subscriber API
  rate_limit:
    # The session names the account on every request. Volume is what gets
    # noticed, so this stays deliberately unhurried and single-threaded.
    requests_per_second: 0.5
    burst: 1
    jitter_seconds: [0.5, 1.5]
  retry:
    max_attempts: 5
    initial_backoff_seconds: 2.0
    backoff_multiplier: 2.0
    max_backoff_seconds: 60.0
    # Never retry 401/403 — a lapsed token is fixed by refreshing, which the
    # connector does explicitly, not by replaying the same request.
    retry_on_status: [408, 429, 500, 502, 503, 504]
  concurrency:
    per_connector: 1
  headers:
    Accept: "application/json, text/plain, */*"
    Accept-Language: "fr-FR,fr;q=0.9,en;q=0.8"
    Referer: "https://app.j360.info/"

health:
  min_expected_items: 1
  max_acceptable_duration_seconds: 600
  empty_run_alert_threshold: 2
