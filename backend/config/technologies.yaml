# Technologies a tender can require and a CV can evidence.
#
# WHY THIS IS NOT config/scoring.yaml
# -----------------------------------
# scoring.yaml answers "is this tender in our line of business" — it holds
# service categories: tierce maintenance applicative, portail, assistance
# technique. Correct for that question, and useless for this one. Locked
# against it, a real consultation asking for Symfony, PHP, Docker, Kubernetes,
# GitLab and SonarQube matched on "monitoring" and "DevOps" and scored every
# candidate at 10-20% technology coverage.
#
# The same file already documents the distinction between `terms` (what Inetum
# calls its offering) and `search_terms` (what a buyer writes in a notice).
# This is the third vocabulary: what an engineer actually works with.
#
# HOW IT IS USED
# --------------
# A term found in the tender text becomes *required*. A candidate evidencing
# none of the required terms is vetoed to zero, however well their prose reads
# — the anti-bias rule from the specification.
#
# Matching is on word boundaries, for the reason scoring learned the hard way:
# substring matching fired `SI` inside "assimilés" and `.NET` inside a buyer
# named "Khazanet".
#
# EXTENDING IT
# ------------
# This list is a starting point drawn from the corpus at hand, not a complete
# taxonomy. Adding a term is a config edit and a `POST /sources/sync`; missing
# one costs recall on that technology and nothing else.
version: 1

groups:
  languages:
    - "Java"
    - "Python"
    - "PHP"
    - "C#"
    - ".NET"
    - "TypeScript"
    - "JavaScript"
    # The bare token "Go" is deliberately absent: it is one of the commonest
    # verbs in English and no disqualifying pattern covers "go further", "go
    # live", "go beyond". Same remedy as "SAGE" in the scoring profile — drop
    # the ambiguous token, keep the unmistakable one.
    - "Golang"
    - "Kotlin"
    - "Swift"
    - "COBOL"
    - "ABAP"
    - "PL/SQL"
    - "Scala"

