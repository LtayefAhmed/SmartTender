# =============================================================================
# Tender relevance scoring profile.
#
# The score is a weighted aggregation of independent criteria, each of which
# returns a normalised value in [0, 1] together with a human-readable
# explanation. Nothing here is hardcoded in the engine: adding a criterion to
# `weights` with a registered scorer name is enough to change the outcome.
#
# `version` is persisted alongside every computed score so that any ranking can
# be reproduced or explained after the fact. BUMP IT whenever you edit weights.
# =============================================================================
version: "2026.3"
name: "inetum-default"

# Weights need not sum to 1: the engine normalises over the criteria that
# actually produced a value, so a missing budget never penalises a tender.
weights:
  field_of_work: 0.38
  deadline_proximity: 0.22
  keywords: 0.13
  budget: 0.09
  # Raised from 0.05. At that level a software tender in a country Inetum does
  # not operate in scored within a rounding error of one in Tunis, which made
  # the criterion decorative. 0.13 lets geography separate two otherwise equal
  # opportunities without ever outweighing whether the work is ours to do.
  location: 0.13
  organization: 0.05
  # Secondary signals — enabled with a non-zero weight when the history table
  # has enough volume to be meaningful.
  cpv_similarity: 0.00
  historical_success: 0.00
  procurement_type: 0.00

# Relevance bands drive the dashboard badges/colours.
bands:
  highly_relevant:
    min_score: 0.75
    label: "Highly Relevant"
    color: "#1BD3BC"
  relevant:
    min_score: 0.50
    label: "Relevant"
    color: "#FFB454"
  low_relevance:
    min_score: 0.0
    label: "Low Relevance"
    color: "#6C7BB8"

criteria:
  # ---------------------------------------------------------------------------
  field_of_work:
    # ─────────────────────────────────────────────────────────────────────────
    # Inetum Tunisie's actual service catalogue — the seven domains from the
    # capability deck. This is the definition of "is this tender ours", and the
    # highest-weighted criterion in the profile.
    #
    # Each domain carries TWO vocabularies, and the distinction is the whole
    # point:
    #
    #   `terms`         What Inetum calls its own offering: SAGE X3, S4/HANA,
    #                   Copilot. Used for SCORING, against a tender's full text
    #                   (title, description, and any extracted PDF), where a
    #                   buyer naming a product is decisive evidence.
    #
    #   `search_terms`  What a public buyer actually writes in a notice title:
    #                   "progiciel de gestion intégré", "gestion des ressources
    #                   humaines". Used for SEARCHING the portals.
    #
    # Searching TUNEPS for "SAGE X3" returns nothing — Tunisian notices are not
    # written in a vendor's vocabulary. Scoring on "progiciel" alone would be
    # too vague to separate an ERP project from a stationery order. Keeping the
    # two apart is what makes both work.
    # ─────────────────────────────────────────────────────────────────────────
    profiles:
      - name: "SAGE"
        weight: 1.0
        # ⚠ The bare token "SAGE" is deliberately absent. In French public
        # procurement a *SAGE* is a Schéma d'Aménagement et de Gestion des Eaux
        # — a water-management plan. Matching it alone scored a soil-survey
        # contract ("le SAGE de la Lys") at 0.81, ahead of every real IT tender.
        # Only the qualified product names identify the vendor unambiguously.
        terms:
          - "SAGE X3"
          - "SAGE XRT"
          - "SAGE 1000"
          - "SAGE FRP"
          - "progiciel Sage"
          - "solution Sage"
          - "SXA"
          - "Youdoc"
          - "WMS"
          - "gestion d'entrepôt"
        search_terms:
          - "progiciel de gestion"
          - "ERP"
          - "gestion intégrée"
          - "gestion commerciale"
          - "gestion d'entrepôt"

      - name: "SIRH"
        weight: 1.0
        terms:
          - "SIRH"
          - "Sage Factorial"
          - "SuccessFactors"
          - "AGIRH"
          - "gestion des ressources humaines"
          - "gestion de la paie"
        search_terms:
          - "ressources humaines"
          - "SIRH"
          - "paie"
          - "gestion du personnel"

      - name: "SAP"
        weight: 1.0
        terms:
          - "SAP"
          - "S/4HANA"
          - "S4HANA"
          - "HANA"
          - "Ariba"
          - "SAP CX"
        search_terms:
          - "SAP"
          - "progiciel de gestion"
          - "ERP"

      - name: "Microsoft"
        weight: 1.0
        terms:
          - "Microsoft"
          - "Dynamics"
          - "CRM"
          - "Power Platform"
          - "Power BI"
          - "Azure"
          - "Microsoft 365"
          - "M365"
          - "Copilot"
          - "SharePoint"
        search_terms:
          - "CRM"
          - "relation client"
          - "Microsoft"
          - "Azure"
          - "messagerie collaborative"

      - name: "Application Services"
        weight: 1.0
        terms:
          - "tierce maintenance applicative"
          - "TMA"
          - "maintenance applicative"
          - "portail"
          - "solutions digitales"
          - "assistance technique"
          - "mise à disposition de ressources"
          - "infogérance"
          - "infrastructure"
        search_terms:
          - "maintenance applicative"
          - "développement"
          - "assistance technique"
          - "portail web"
          - "infogérance"
          - "logiciel"

      - name: "Digital consulting"
        weight: 0.9
        terms:
          - "architecture d'entreprise"
          - "architecture technique"
          - "urbanisation"
          - "DevOps"
          - "API management"
          - "RPA"
          - "automatisation des processus"
          - "monitoring"
          - "observabilité"
          - "schéma directeur"
        search_terms:
          - "schéma directeur"
          - "architecture"
          - "conseil"
          - "audit informatique"
          - "transformation digitale"

      - name: "IA & Data"
        weight: 0.95
        terms:
          - "data management"
          - "gouvernance des données"
          - "data visualisation"
          - "dataviz"
          - "business intelligence"
          - "décisionnel"
          - "entrepôt de données"
          - "datawarehouse"
          - "big data"
          - "intelligence artificielle"
          - "machine learning"
          - "FABLAB"
        search_terms:
          - "intelligence artificielle"
          - "données"
          - "décisionnel"
          - "business intelligence"
          - "entrepôt de données"

    # Below this similarity the criterion is considered a non-match (0.0).
    floor: 0.15

  # ---------------------------------------------------------------------------
  deadline_proximity:
    # Opportunities are worth more when there is *enough* time left to respond,
    # and worthless once unreachable. The curve is therefore not monotonic.
    min_viable_days: 5      # below this, responding is unrealistic -> heavy decay
    ideal_min_days: 12      # start of the sweet spot -> score 1.0
    ideal_max_days: 45      # end of the sweet spot -> score 1.0
    horizon_days: 180       # beyond this the opportunity is too speculative
    expired_score: 0.0
    unknown_deadline_score: 0.35   # missing deadline: neutral-low, never 0

  # ---------------------------------------------------------------------------
  keywords:
    # Positive keywords lift the score; blocking keywords zero the whole tender.
    match_mode: "weighted"     # weighted | count
    saturation_at: 6           # number of distinct hits that reaches 1.0
    include:
      "appel d'offres international": 0.6
      "assistance technique": 0.8
      "développement": 1.0
      "maintenance applicative": 1.0
      "tierce maintenance": 1.0
      "infogérance": 0.9
      "migration": 0.8
      "audit": 0.7
      "formation": 0.4
      "consultant": 0.9
      "expert": 0.7
      "digitalisation": 0.9
      "dématérialisation": 0.9
      "SI": 0.5
    # Hard exclusions — a hit here forces the global score to 0 and flags the
    # tender as out-of-scope rather than merely irrelevant.
    exclude:
      - "travaux de génie civil"
      - "fourniture de carburant"
      - "restauration collective"
      - "gardiennage"
      - "nettoyage des locaux"
      - "matériel médical"

  # ---------------------------------------------------------------------------
  budget:
    currency: "TND"
    # Piecewise-linear preference curve over the estimated amount.
    too_small_below: 50000        # under this the deal does not pay for itself
    ideal_min: 250000
    ideal_max: 5000000
    too_large_above: 25000000     # above this we would need a consortium
    unknown_budget_score: 0.5     # missing budget is common: stay neutral
    # Static conversion table used only for ranking comparability.
    fx_to_currency:
      TND: 1.0
      EUR: 3.35
      USD: 3.10
      XOF: 0.0051

  # ---------------------------------------------------------------------------
  location:
    # Home market first, then the territories the team actually watches.
    # Mauritania sits high because it is half of the standing J360 search
    # (countries=TN,MR) — it was absent from this list entirely, so every
    # Mauritanian tender was scored as an unknown country at 0.3 while the
    # team was actively monitoring it.
    preferred:
      "Tunisie": 1.0
      "Tunisia": 1.0
      "Tunis": 1.0
      "Mauritanie": 0.85
      "Maroc": 0.8
      "Algérie": 0.75
      "Libye": 0.65
      "France": 0.75          # Inetum group — delivery is credible
      "Belgique": 0.6
      "Sénégal": 0.65
      "Côte d'Ivoire": 0.65
      "Mali": 0.55
      "Burkina Faso": 0.55
    # A country nobody listed is not disqualifying — it is simply unproven, and
    # a strong enough technical fit can still carry it.
    default_score: 0.3
    unknown_score: 0.4

  # ---------------------------------------------------------------------------
  organization:
    # Known buyers we have a relationship or a track record with.
    preferred:
      "Ministère des Technologies de la Communication": 1.0
      "Banque Centrale de Tunisie": 0.95
      "Tunisie Telecom": 0.95
      "STEG": 0.85
      "CNSS": 0.8
      "Banque Africaine de Développement": 0.9
      "Banque Européenne d'Investissement": 0.9
      "Union Européenne": 0.85
      "Banque Mondiale": 0.85
    default_score: 0.4
    unknown_score: 0.4

  # ---------------------------------------------------------------------------
  cpv_similarity:
    # Common Procurement Vocabulary. Matching is hierarchical: a shared 8-digit
    # prefix scores higher than a shared 2-digit division.
    preferred_codes:
      - "72000000"   # IT services
      - "72200000"   # Software programming and consultancy
      - "72300000"   # Data services
      - "72500000"   # Computer-related services
      - "72600000"   # Computer support and consultancy
      - "48000000"   # Software packages and information systems
      - "79400000"   # Business and management consultancy
    unknown_score: 0.4

  # ---------------------------------------------------------------------------
  historical_success:
    # Win rate over *decided* submissions (`submissions` table) for the same
    # buyer, falling back to the same sector. Pending bids are excluded: most
    # awards are published months later, and counting them as losses would
    # penalise every buyer with a slow procurement cycle.
    #
    # The weight above is 0.00 because the table starts empty. Raise it to
    # ~0.05 once you have recorded a few dozen decided submissions — before
    # then the criterion abstains anyway, so enabling it early is harmless but
    # pointless. Bump `version` when you do.
    min_samples: 5
    prior: 0.5

  # ---------------------------------------------------------------------------
  procurement_type:
    preferred:
      "open": 1.0
      "restricted": 0.8
      "negotiated": 0.6
      "framework_agreement": 0.9
      "prior_information_notice": 0.5
      "expression_of_interest": 0.7
      "direct_award": 0.2
    unknown_score: 0.5
